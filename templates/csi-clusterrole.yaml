{{- template "vault.csiEnabled" . -}}
{{- if .csiEnabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "vault.fullname" . }}-csi-provider-clusterrole
  labels:
    helm.sh/chart: {{ include "vault.chart" . }}
    app.kubernetes.io/name: {{ include "vault.name" . }}-csi-provider
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- include "vault.commonLabels" (dict "ctx" . "version" .Values.csi.image.tag) | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  verbs:
  - create
# Required by the vault-csi-provider "aws" auth type to read the IAM role
# annotation from the requesting pod's service account.
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
{{- end }}
